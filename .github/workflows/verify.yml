name: Verify research artifact
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - run: python scripts/audit_results.py
      - run: python scripts/audit_ablation_results.py
      - run: python scripts/audit_no_peer_restart_full.py
      - run: python scripts/audit_no_peer_no_restart.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q qagent scripts
